# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo:
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: false

menu:
  Home: / || fas fa-home
  Pages||fas fa-compass:
    Archives: /archives/ || fas fa-archive
    Tags: /tags/ || fas fa-tags
    Categories: /categories/ || fas fa-folder-open
    Gallery: /gallery/ || fas fa-images
    Talking: /talking/ || fas fa-comment-dots
    Examples: /examples/ || fas fa-thumbs-up
    yt-dlp Builder: /yt-dlp/ || fas fa-download
  Docs||fas fa-book:
    🚀 Quick Start: /posts/21cfbf15/
    📑 Theme Pages: /posts/dc584b87/
    🛠 Theme Config: /posts/4aa8abbe/
    ⚔️ Tag Plugins: /posts/ceeb73f/
    ❓ FAQ: /posts/98d20436/
    ⚡️ Advanced Tutorial: /posts/4073eda/
    ✨ Update Log: /posts/198a4240/
  Messageboard: /messageboard/ || fas fa-envelope

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: 400
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: true

# Social media links
# Formal:
#   icon: link || the description || color
social:
  fas fa-envelope: mailto:my@crazywong.com || Email
  fas fa-rss: /atom.xml || RSS

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /img/Sung Jin Woo.jpeg

avatar:
  img: /img/Sung Jin Woo.jpeg
  effect: false

# Disable all banner images
disable_top_img: false

# If the banner of page not setting, it will show the default_top_img
default_top_img: https://oss.012700.xyz/butterfly/2024/10/index.jpg

# The banner image of index page
index_img: https://oss.012700.xyz/butterfly/2024/10/index.jpg

# The banner image of archive page
archive_img: https://oss.012700.xyz/butterfly/2024/10/archive.jpg

# Note: tag page, not tags page
tag_img: https://oss.012700.xyz/butterfly/2024/10/tag.png

# The banner image of tag page, you can set the banner image for each tag
# Format:
#  - tag name: xxxxx
tag_per_img:

# Note: category page, not categories page
category_img: https://oss.012700.xyz/butterfly/2024/10/category.jpg

# The banner image of category page, you can set the banner image for each category
# Format:
#  - category name: xxxxx
category_per_img:

# The background image of footer
footer_img: true

# Website Background
# Can set it to color or image url
background:

cover:
  # Disable the cover or not
  index_enable: true
  aside_enable: true
  archives_enable: true
  # When cover is not set, the default cover is displayed
  default_cover:
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-1.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-2.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-3.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-4.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-5.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-6.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-7.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-8.png
    - https://oss.012700.xyz/butterfly/2024/11/butterfly-docs-changelog-cover-9.png

# Replace Broken Images
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: https://oss.012700.xyz/butterfly/2024/10/butterfly-404.png

post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: created
    # Choose: date / relative
    date_format: relative
    categories: true
    tags: false
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: created
    # Choose: date / relative
    date_format: relative
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
index_top_img_height:

# The subtitle on homepage
subtitle:
  enable: true
  # Typewriter Effect
  effect: true
  # Customize typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
    loop: true
  # Source - Call the third-party service API (Chinese only)
  # It will show the source first, then show the content of sub
  # Choose: false/1/2/3
  # false - disable the function
  # 1 - hitokoto.cn
  # 2 - yijuzhan.com
  # 3 - jinrishici.com
  source: false
  # If you close the typewriter effect, the subtitle will only show the first line of sub
  sub:
    - What does not kill me makes me stronger
    - Beauty is everywhere. It is not that she is lacking to our eye, but our eyes which fail to perceive her

# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 3

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 3
  length: 500 # if you set method to 2 or 3, the length need to config

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: false
  text:
  QR_code:

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  url:

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# Displays outdated notice for a post
noticeOutdate:
  enable: false
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 365
  # Position: top / bottom
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# Footer Settings
# --------------------------------------

footer:
  nav:
    - content:
      - title: Docs
        item:
          - title: 🚀 Quick Start
            url: /posts/21cfbf15/
          - title: 📑 Theme Pages
            url: /posts/dc584b87/
          - title: 🛠 Theme Config
            url: /posts/4aa8abbe/
          - title: ⚔️ Tag Plugins
            url: /posts/ceeb73f/
          - title: ❓ FAQ
            url: /posts/98d20436/
          - title: ⚡️ Advanced Tutorial
            url: /posts/4073eda/
    - content:
      - title: Other
        item:
          - title: Gallery
            url: /gallery/
          - title: Messageboard
            url: /messageboard/
          - title: Talking
            url: /talking/
          - title: Examples
            url: /examples/
    - content:
      - title: Framework
        item:
          - title: Hexo
            url: https://hexo.io/
          - title: Butterfly
            url: https://butterfly.js.org/
  owner:
    enable: true
    since: 2019
  custom_text:
  # Copyright of theme and framework
  copyright:
    enable: true
    version: true

# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
  # Show the button to hide the aside in bottom right button
  button: true
  mobile: true
  # Position: left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Theme GitHub
      link: https://github.com/jerryc127/hexo-theme-butterfly
  card_announcement:
    enable: true
    content: >
      If you have any questions, please submit feedback at
      <a href="https://github.com/jerryc127/hexo-theme-butterfly/issues" style="color:#49b1f5">Github Issues</a>.
  card_recent_post:
    enable: true
    # If set 0 will show all
    limit: 5
    # Sort: date / updated
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # Unit: mins, save data to localStorage
    storage: 5
    avatar: true
  card_categories:
    enable: true
    # If set 0 will show all
    limit: 0
    # Choose: none / true / false
    expand: false
    sort_order:
  card_tags:
    enable: true
    # If set 0 will show all
    limit: 40
    color: true
    # Order of tags, random/name/length
    orderby: random
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: 1
    sort_order:
  card_archives:
    enable: true
    # Type: monthly / yearly
    type: monthly
    # Eg: YYYY年MM月
    format: MMMM YYYY
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
    # If set 0 will show all
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # The title shows the series name
    series_title: false
    # Order by title or date
    orderBy: 'date'
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date: 2025/09/01 00:00:00

# --------------------------------------
# Bottom right button
# --------------------------------------

# The distance between the bottom right button and the bottom (default unit: px)
rightside_bottom:

# Conversion between Traditional and Simplified Chinese
translate:
  enable: false
  default: 簡
  defaultEncoding: 1
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '簡'

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  autoChangeMode: 1
  start:
  end:

# Show scroll percent in scroll-to-top button
rightside_scroll_percent: true

# Don't modify the following settings unless you know how they work
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment
rightside_item_order:
  enable: true
  hide: readmode,darkmode,hideAside
  show: toc,translate,chat,comment

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  auto_update: false
  click_to_scroll: true

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# Need to install the hexo-wordcount plugin
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math
# --------------------------------------

math:
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    enableMenu: true
    tags: none

  katex:
    copy_tex: false

# --------------------------------------
# Search
# --------------------------------------

search:
  # Choose: algolia_search / local_search / docsearch
  use: local_search
  placeholder:

  algolia_search:
    hitsPerPage: 6

  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8
    CDN:

  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
